name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil-go/go.mod

      - name: Run yggdrasil-go unit tests
        working-directory: yggdrasil-go
        run: go test -v -timeout 10m -run "^Test(CoreWriteToReadFrom|TenClientsToOneServer)$" ./contrib/lib/

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: linux
            arch: x86_64
            os: ubuntu-latest
          - name: macOS universal
            platform: macos
            arch: universal
            os: macos-latest
          - name: Windows x86_64
            platform: windows
            arch: x86_64
            os: ubuntu-latest
          - name: Android arm64
            platform: android
            arch: arm64
            os: ubuntu-latest
          - name: iOS arm64
            platform: ios
            arch: arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil-go/go.mod

      - name: Install SCons
        run: pip install scons

      # -- godot-cpp cache keyed on submodule commit --
      - name: Get godot-cpp commit hash
        id: godot-cpp
        shell: bash
        run: echo "hash=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin/
            godot-cpp/gen/
            .sconsign.dblite
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.godot-cpp.outputs.hash }}
          restore-keys: |
            godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-

      # -- Platform-specific setup --
      - name: Install MinGW cross-compiler (Windows from Linux)
        if: matrix.platform == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Set Android NDK env vars
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # -- Build --
      - name: Build GDExtension
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXTRA_ARGS="use_mingw=yes"
          fi
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug $EXTRA_ARGS

      # -- Upload --
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/*.framework/
            bin/*.so
            bin/*.dll
            bin/*.dylib

  vest-test:
    name: Vest Tests (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: gdextension-linux-x86_64
            godot_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
            godot_bin: Godot_v4.6-stable_linux.x86_64
          - name: macOS
            os: macos-latest
            artifact: gdextension-macos-universal
            godot_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
            godot_bin: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/yggdrasil-test-app/addons/yggdrasil/bin/

      - name: Download Godot 4.6
        shell: bash
        run: |
          curl -L -o godot.zip "${{ matrix.godot_url }}"
          unzip godot.zip -d godot_bin
          chmod +x godot_bin/${{ matrix.godot_bin }}

      - name: Import project (generate .godot/)
        shell: bash
        working-directory: app/yggdrasil-test-app
        run: |
          timeout 30 ../../godot_bin/${{ matrix.godot_bin }} --headless --import || true

      - name: Run vest tests
        shell: bash
        working-directory: app/yggdrasil-test-app
        run: |
          ../../godot_bin/${{ matrix.godot_bin }} --headless \
            -s addons/vest/cli/vest-cli.gd \
            --vest-glob "res://test/**/*.test.gd" \
            --vest-report-format tap \
            --no-only
