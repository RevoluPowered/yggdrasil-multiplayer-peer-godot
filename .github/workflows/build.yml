name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil-go/go.mod

      - name: Run yggdrasil-go unit tests
        working-directory: yggdrasil-go
        run: go test -v -timeout 30m ./contrib/lib/

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: linux
            arch: x86_64
            os: ubuntu-latest
          - name: macOS universal
            platform: macos
            arch: universal
            os: macos-latest
          - name: Windows x86_64
            platform: windows
            arch: x86_64
            os: windows-latest
          - name: Android arm64
            platform: android
            arch: arm64
            os: ubuntu-latest
          - name: iOS arm64
            platform: ios
            arch: arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: yggdrasil-go/go.mod

      - name: Install SCons
        run: pip install scons

      # -- godot-cpp cache keyed on submodule commit --
      - name: Get godot-cpp commit hash
        id: godot-cpp
        shell: bash
        run: echo "hash=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin/
            godot-cpp/gen/
            .sconsign.dblite
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.godot-cpp.outputs.hash }}
          restore-keys: |
            godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-

      # -- Platform-specific setup --
      - name: Add MinGW to PATH (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set ANDROID_NDK_HOME
        if: matrix.platform == 'android'
        shell: bash
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # -- Build --
      - name: Build GDExtension
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXTRA_ARGS="use_mingw=yes"
          fi
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug $EXTRA_ARGS

      # -- Upload --
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/*.framework/
            bin/*.so
            bin/*.dll
            bin/*.dylib
